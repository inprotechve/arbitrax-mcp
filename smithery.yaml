startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    paymentProof:
      type: string
      description: "Optional: Base L2 USDC transaction hash to unlock full-tier arbitrage analysis."
commandFunction: |-
  (config) => ({
    command: 'node',
    args: ['bin/cli.js'],
    env: {
      X_402_PAYMENT_PROOF: config.paymentProof || ''
    }
  })
